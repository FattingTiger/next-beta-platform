[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "beta-center-server"
version = "0.1.0"
description = "Internal Android beta distribution and feedback platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<1",
  "locust>=2.37,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beta_center"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: integration tests that exercise storage or external tools",
  "security: authorization and abuse-resistance tests",
  "ui: server-rendered admin UI tests",
  "load: deterministic load-profile tests",
]

[tool.coverage.run]
branch = true
source = ["beta_center"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "C4", "PIE", "RUF"]
ignore = ["S101", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"src/beta_center/dependencies.py" = ["B008"]
"src/beta_center/routers/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["beta_center"]
