# Unix maintenance is limited to the dedicated PostgreSQL OS account.
local   all             beta-pg                                peer
local   all             all                                    reject

# The application is the only TCP client and PostgreSQL only listens on IPv4
# loopback. Explicit rejects make accidental future listener changes fail shut.
host    beta_center     beta_center     127.0.0.1/32            scram-sha-256
host    all             all             0.0.0.0/0               reject
host    all             all             ::0/0                    reject

