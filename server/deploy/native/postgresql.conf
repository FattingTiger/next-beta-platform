listen_addresses = '127.0.0.1'
port = 55432
unix_socket_directories = '/run/beta-center-pg'
password_encryption = 'scram-sha-256'

# The staging host has approximately 980 MiB RAM and one vCPU. PostgreSQL used
# about 41 MiB of its 192 MiB cgroup limit during the 40-VU calibration run.
# Twenty application-pool connections plus PostgreSQL's reserved and
# maintenance headroom stay bounded without competing aggressively with the
# pre-existing sing-box service.
max_connections = 28
shared_buffers = 48MB
effective_cache_size = 128MB
work_mem = 1MB
maintenance_work_mem = 16MB
autovacuum_work_mem = 8MB
wal_buffers = 2MB
max_wal_size = 256MB
min_wal_size = 64MB
checkpoint_completion_target = 0.9
random_page_cost = 1.5
effective_io_concurrency = 2
max_worker_processes = 4
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
jit = off

logging_collector = off
log_destination = 'stderr'
log_connections = off
log_disconnections = off
log_statement = 'none'
log_min_duration_statement = 1000
timezone = 'UTC'

ssl = off
fsync = on
synchronous_commit = on
full_page_writes = on
