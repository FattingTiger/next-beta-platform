worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_body_timeout 60s;
    client_header_timeout 15s;
    client_max_body_size 2m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    # The published loopback port is reached through Docker's ingress bridge.
    # Trust only that exact peer (plus local self-requests), then walk XFF from
    # right to left until the first untrusted, original client address.
    set_real_ip_from ${BETA_NGINX_TRUSTED_PROXY};
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format structured escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"transport_peer":"$realip_remote_addr",'
        '"request":"$request_method $uri $server_protocol","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"request_id":"$request_id"}';
    access_log /dev/stdout structured;

    limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=password_change_per_ip:10m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

    map $request_method $upload_client_key {
        default "";
        POST $binary_remote_addr;
        PUT $binary_remote_addr;
        PATCH $binary_remote_addr;
    }
    limit_req_zone $upload_client_key zone=uploads_per_ip:10m rate=12r/m;
    limit_conn_zone $upload_client_key zone=upload_connections_per_ip:10m;

    map $http_x_forwarded_proto $trusted_forwarded_proto {
        default $scheme;
        https https;
    }

    upstream beta_center_app {
        server app:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        location = /_upload-auth/admin {
            internal;
            # The subrequest inherits the main request's Content-Length for
            # Nginx's size check even though no body is proxied. Disable that
            # check only inside this internal, bodyless auth location.
            client_max_body_size 0;
            proxy_pass http://beta_center_app/api/v1/auth/upload-permission/admin;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /_upload-auth/user {
            internal;
            client_max_body_size 0;
            proxy_pass http://beta_center_app/api/v1/auth/upload-permission/user;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api/v1/auth/login {
            limit_req zone=login_per_ip burst=10 nodelay;
            proxy_pass http://beta_center_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api/v1/auth/change-password {
            client_max_body_size 16k;
            limit_req zone=password_change_per_ip burst=2 nodelay;
            limit_conn connections_per_ip 1;
            proxy_pass http://beta_center_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
        }

        location ~ ^/api/v1/admin/apps/[^/]+/(icon|screenshots)$ {
            auth_request /_upload-auth/admin;
            client_max_body_size 12m;
            limit_req zone=uploads_per_ip burst=4 nodelay;
            limit_conn upload_connections_per_ip 2;
            proxy_pass http://beta_center_app;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 5m;
            proxy_send_timeout 5m;
        }

        location ~ ^/api/v1/admin/apps/[^/]+/versions$ {
            auth_request /_upload-auth/admin;
            client_max_body_size 520m;
            limit_req zone=uploads_per_ip burst=4 nodelay;
            limit_conn upload_connections_per_ip 2;
            proxy_pass http://beta_center_app;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 10m;
            proxy_send_timeout 10m;
        }

        location = /api/v1/bugs {
            auth_request /_upload-auth/user;
            client_max_body_size 60m;
            limit_req zone=uploads_per_ip burst=4 nodelay;
            limit_conn upload_connections_per_ip 2;
            proxy_pass http://beta_center_app;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 5m;
            proxy_send_timeout 5m;
        }

        location ^~ /api/v1/downloads/ {
            limit_conn connections_per_ip 4;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 10m;
            proxy_send_timeout 10m;
            proxy_pass http://beta_center_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
        }

        # This location is never reachable from a client. The API may return an
        # X-Accel-Redirect into it only after it has authenticated the user,
        # rechecked group visibility, and recorded the download ticket.
        location ^~ /_protected-files/ {
            internal;
            alias /var/lib/beta-center/storage/;
            disable_symlinks on;
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            proxy_pass http://beta_center_app;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }
    }
}
